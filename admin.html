<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>LUMÉRA — لوحة الإدارة</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0b0b0b;
      color: #fff;
      min-height: 100vh;
    }

    :root {
      --gold: #d6b36a;
      --gold-light: #f0d99b;
      --dark: #111;
      --card: #171717;
      --border: #2b2b2b;
      --muted: #aaa;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    /* LOGIN */

    .auth-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background:
        radial-gradient(circle at top, #28200f 0%, #0b0b0b 45%);
    }

    .auth-box {
      width: 100%;
      max-width: 430px;
      background: #151515;
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 35px;
      box-shadow: 0 20px 80px rgba(0,0,0,.5);
    }

    .logo {
      text-align: center;
      color: var(--gold);
      font-size: 32px;
      letter-spacing: 5px;
      margin-bottom: 10px;
      font-weight: bold;
    }

    .auth-title {
      text-align: center;
      margin-bottom: 28px;
      color: #ddd;
    }

    .field {
      margin-bottom: 17px;
    }

    .field label {
      display: block;
      margin-bottom: 8px;
      color: #ddd;
    }

    .field input,
    .field textarea,
    .field select {
      width: 100%;
      background: #0d0d0d;
      border: 1px solid #333;
      color: white;
      border-radius: 10px;
      padding: 13px;
      outline: none;
    }

    .field input:focus,
    .field textarea:focus,
    .field select:focus {
      border-color: var(--gold);
    }

    .main-btn {
      width: 100%;
      border: 0;
      background: var(--gold);
      color: #111;
      padding: 14px;
      border-radius: 10px;
      font-weight: bold;
      margin-top: 5px;
    }

    .main-btn:hover {
      background: var(--gold-light);
    }

    .secondary-btn {
      width: 100%;
      border: 1px solid #444;
      background: transparent;
      color: white;
      padding: 12px;
      border-radius: 10px;
      margin-top: 12px;
    }

    .secondary-btn:hover {
      border-color: var(--gold);
      color: var(--gold);
    }

    .message {
      margin-top: 15px;
      text-align: center;
      line-height: 1.7;
      color: #ddd;
    }

    .hidden {
      display: none !important;
    }

    /* DASHBOARD */

    .dashboard {
      display: none;
      min-height: 100vh;
    }

    .topbar {
      height: 70px;
      border-bottom: 1px solid var(--border);
      background: #111;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 25px;
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .top-logo {
      color: var(--gold);
      font-size: 23px;
      letter-spacing: 4px;
      font-weight: bold;
    }

    .logout-btn {
      background: transparent;
      border: 1px solid #555;
      color: white;
      padding: 9px 15px;
      border-radius: 8px;
    }

    .logout-btn:hover {
      border-color: #e66;
      color: #e66;
    }

    .container {
      width: min(1200px, 94%);
      margin: 30px auto;
    }

    .welcome {
      margin-bottom: 25px;
    }

    .welcome h1 {
      font-size: 27px;
      margin-bottom: 7px;
    }

    .welcome p {
      color: var(--muted);
    }

    .tabs {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      margin-bottom: 25px;
      padding-bottom: 4px;
    }

    .tab {
      white-space: nowrap;
      background: #151515;
      border: 1px solid #333;
      color: #ccc;
      padding: 11px 18px;
      border-radius: 9px;
    }

    .tab.active {
      background: var(--gold);
      color: #111;
      border-color: var(--gold);
      font-weight: bold;
    }

    .section {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 15px;
      padding: 25px;
      margin-bottom: 25px;
    }

    .section h2 {
      margin-bottom: 20px;
      color: var(--gold);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }

    .full {
      grid-column: 1 / -1;
    }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }

    .product-card {
      background: #101010;
      border: 1px solid #2c2c2c;
      border-radius: 14px;
      overflow: hidden;
    }

    .product-card img {
      width: 100%;
      height: 210px;
      object-fit: cover;
      background: #222;
    }

    .product-info {
      padding: 15px;
    }

    .product-info h3 {
      margin-bottom: 8px;
    }

    .product-price {
      color: var(--gold);
      font-weight: bold;
      margin-bottom: 12px;
    }

    .product-actions {
      display: flex;
      gap: 8px;
    }

    .product-actions button {
      flex: 1;
      padding: 9px;
      border-radius: 8px;
      border: 1px solid #444;
      background: transparent;
      color: white;
    }

    .product-actions .edit {
      border-color: var(--gold);
      color: var(--gold);
    }

    .product-actions .delete {
      border-color: #7b3333;
      color: #ff7777;
    }

    .status {
      padding: 12px;
      border-radius: 9px;
      background: #101010;
      border: 1px solid #333;
      margin-bottom: 18px;
      display: none;
    }

    .status.show {
      display: block;
    }

    .empty {
      color: #999;
      text-align: center;
      padding: 35px;
    }

    .preview {
      margin-top: 10px;
      max-width: 180px;
      max-height: 180px;
      border-radius: 10px;
      display: none;
    }

    @media (max-width: 750px) {
      .grid {
        grid-template-columns: 1fr;
      }

      .products-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .section {
        padding: 18px;
      }

      .topbar {
        padding: 0 15px;
      }

      .top-logo {
        font-size: 18px;
      }
    }

    @media (max-width: 500px) {
      .products-grid {
        grid-template-columns: 1fr;
      }

      .auth-box {
        padding: 25px 20px;
      }
    }
  </style>
</head>

<body>

  <!-- ================= LOGIN ================= -->

  <div id="authScreen" class="auth-screen">

    <!-- LOGIN -->
    <div id="loginBox" class="auth-box">

      <div class="logo">LUMÉRA</div>
      <div class="auth-title">لوحة إدارة المتجر</div>

      <div class="field">
        <label>البريد الإلكتروني</label>
        <input id="loginEmail" type="email" autocomplete="email">
      </div>

      <div class="field">
        <label>كلمة المرور</label>
        <input id="loginPassword" type="password" autocomplete="current-password">
      </div>

      <button class="main-btn" onclick="login()">
        تسجيل الدخول
      </button>

      <button class="secondary-btn" onclick="showRecovery()">
        نسيت كلمة المرور؟
      </button>

      <div id="loginMessage" class="message"></div>

    </div>


    <!-- PASSWORD RECOVERY -->
    <div id="recoveryBox" class="auth-box hidden">

      <div class="logo">LUMÉRA</div>
      <div class="auth-title">استرجاع كلمة المرور</div>

      <div class="field">
        <label>البريد الإلكتروني</label>
        <input id="recoveryEmail" type="email" autocomplete="email">
      </div>

      <button class="main-btn" onclick="sendRecovery()">
        إرسال رابط الاسترجاع
      </button>

      <button class="secondary-btn" onclick="showLogin()">
        العودة لتسجيل الدخول
      </button>

      <div id="recoveryMessage" class="message"></div>

    </div>


    <!-- NEW PASSWORD -->
    <div id="newPasswordBox" class="auth-box hidden">

      <div class="logo">LUMÉRA</div>
      <div class="auth-title">تغيير كلمة المرور</div>

      <div class="field">
        <label>كلمة المرور الجديدة</label>
        <input id="newPassword" type="password" autocomplete="new-password">
      </div>

      <div class="field">
        <label>تأكيد كلمة المرور</label>
        <input id="confirmPassword" type="password" autocomplete="new-password">
      </div>

      <button class="main-btn" onclick="updatePassword()">
        حفظ كلمة المرور الجديدة
      </button>

      <div id="passwordMessage" class="message"></div>

    </div>

  </div>


  <!-- ================= DASHBOARD ================= -->

  <div id="dashboard" class="dashboard">

    <div class="topbar">

      <div class="top-logo">
        LUMÉRA
      </div>

      <button class="logout-btn" onclick="logout()">
        تسجيل الخروج
      </button>

    </div>


    <div class="container">

      <div class="welcome">
        <h1>لوحة التحكم</h1>
        <p id="ownerEmail"></p>
      </div>


      <div class="tabs">

        <button class="tab active" onclick="openTab('productsTab', this)">
          المنتجات
        </button>

        <button class="tab" onclick="openTab('addTab', this)">
          إضافة منتج
        </button>

        <button class="tab" onclick="openTab('storeTab', this)">
          إعدادات المتجر
        </button>

      </div>


      <!-- PRODUCTS -->

      <div id="productsTab" class="tab-content">

        <div class="section">

          <h2>منتجات المتجر</h2>

          <div id="productsStatus" class="status"></div>

          <div id="productsList" class="products-grid"></div>

        </div>

      </div>


      <!-- ADD PRODUCT -->

      <div id="addTab" class="tab-content hidden">

        <div class="section">

          <h2>إضافة منتج جديد</h2>

          <div id="addStatus" class="status"></div>

          <div class="grid">

            <div class="field">
              <label>اسم المنتج</label>
              <input id="productName" type="text">
            </div>

            <div class="field">
              <label>السعر</label>
              <input id="productPrice" type="number" min="0" step="0.01">
            </div>

            <div class="field">
              <label>الفئة</label>

              <select id="productCategory">

                <option value="rings">خواتم</option>
                <option value="bracelets">أساور</option>
                <option value="necklaces">قلائد</option>
                <option value="earrings">أقراط</option>
                <option value="other">أخرى</option>

              </select>

            </div>

            <div class="field">
              <label>المخزون</label>
              <input id="productStock" type="number" min="0" value="1">
            </div>

            <div class="field full">

              <label>الوصف</label>

              <textarea
                id="productDescription"
                rows="5"
              ></textarea>

            </div>

            <div class="field full">

              <label>صورة المنتج</label>

              <input
                id="productImage"
                type="file"
                accept="image/*"
                onchange="previewImage(event)"
              >

              <img id="imagePreview" class="preview">

            </div>

          </div>

          <button class="main-btn" onclick="addProduct()">
            إضافة المنتج
          </button>

        </div>

      </div>


      <!-- STORE SETTINGS -->

      <div id="storeTab" class="tab-content hidden">

        <div class="section">

          <h2>إعدادات المتجر</h2>

          <div id="storeStatus" class="status"></div>

          <div class="grid">

            <div class="field">
              <label>اسم المتجر</label>
              <input id="storeName">
            </div>

            <div class="field">
              <label>Slug</label>
              <input id="storeSlug">
            </div>

            <div class="field full">
              <label>النص الرئيسي</label>
              <input id="storeHero">
            </div>

            <div class="field full">
              <label>نبذة عن المتجر</label>
              <textarea id="storeAbout" rows="5"></textarea>
            </div>

            <div class="field">
              <label>WhatsApp</label>
              <input id="storeWhatsapp">
            </div>

            <div class="field">
              <label>Instagram</label>
              <input id="storeInstagram">
            </div>

            <div class="field">
              <label>العنوان</label>
              <input id="storeAddress">
            </div>

            <div class="field">
              <label>اللون الرئيسي</label>
              <input id="storeColor" type="text" value="#d6b36a">
            </div>

          </div>

          <button class="main-btn" onclick="saveStore()">
            حفظ إعدادات المتجر
          </button>

        </div>

      </div>

    </div>

  </div>


<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
  "https://tjtnflfjuthbcckxtwbz.supabase.co";

/*
  مهم:
  ضع هنا نفس Publishable Key الذي وضعته في index.html
  لا تستخدم Secret Key
*/

const SUPABASE_KEY =
  "sb_publishable_1XAfDfHKqY8mROQekukN1w_a2symK-B";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================================================
   VARIABLES
========================================================= */

let currentUser = null;
let currentStore = null;
let products = [];


/* =========================================================
   HELPERS
========================================================= */

function showMessage(elementId, message) {

  const element = document.getElementById(elementId);

  if (!element) return;

  element.textContent = message;
  element.classList.add("show");

}


function clearMessage(elementId) {

  const element = document.getElementById(elementId);

  if (!element) return;

  element.textContent = "";
  element.classList.remove("show");

}


function escapeHTML(value) {

  if (value === null || value === undefined) {
    return "";
  }

  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}


/* =========================================================
   LOGIN / LOGOUT
========================================================= */

async function login() {

  const email =
    document.getElementById("loginEmail").value.trim();

  const password =
    document.getElementById("loginPassword").value;

  clearMessage("loginMessage");

  if (!email || !password) {

    showMessage(
      "loginMessage",
      "أدخل البريد الإلكتروني وكلمة المرور."
    );

    return;
  }


  const { data, error } =
    await supabaseClient.auth.signInWithPassword({

      email: email,
      password: password

    });


  if (error) {

    console.error(error);

    showMessage(
      "loginMessage",
      "تعذر تسجيل الدخول: " + error.message
    );

    return;
  }


  currentUser = data.user;

  await openDashboard();

}


async function logout() {

  await supabaseClient.auth.signOut();

  currentUser = null;
  currentStore = null;

  document.getElementById("dashboard")
    .style.display = "none";

  document.getElementById("authScreen")
    .style.display = "flex";

  showLogin();

}


/* =========================================================
   PASSWORD RECOVERY
========================================================= */

function showRecovery() {

  document.getElementById("loginBox")
    .classList.add("hidden");

  document.getElementById("recoveryBox")
    .classList.remove("hidden");

  document.getElementById("newPasswordBox")
    .classList.add("hidden");

}


function showLogin() {

  document.getElementById("loginBox")
    .classList.remove("hidden");

  document.getElementById("recoveryBox")
    .classList.add("hidden");

  document.getElementById("newPasswordBox")
    .classList.add("hidden");

}


async function sendRecovery() {

  const email =
    document.getElementById("recoveryEmail")
      .value
      .trim();

  clearMessage("recoveryMessage");

  if (!email) {

    showMessage(
      "recoveryMessage",
      "أدخل البريد الإلكتروني."
    );

    return;
  }


  /*
    هذا الرابط مهم:
    بعد الضغط على رابط Supabase
    يرجع المستخدم مباشرة إلى admin.html
  */

  const redirectTo =
    window.location.origin +
    window.location.pathname;


  const { error } =
    await supabaseClient.auth.resetPasswordForEmail(
      email,
      {
        redirectTo: redirectTo
      }
    );


  if (error) {

    console.error(error);

    showMessage(
      "recoveryMessage",
      "تعذر إرسال الرابط: " + error.message
    );

    return;
  }


  showMessage(
    "recoveryMessage",
    "تم إرسال رابط تغيير كلمة المرور إلى بريدك الإلكتروني."
  );

}


async function updatePassword() {

  const password =
    document.getElementById("newPassword").value;

  const confirm =
    document.getElementById("confirmPassword").value;

  clearMessage("passwordMessage");


  if (password.length < 6) {

    showMessage(
      "passwordMessage",
      "كلمة المرور يجب أن تكون 6 أحرف على الأقل."
    );

    return;
  }


  if (password !== confirm) {

    showMessage(
      "passwordMessage",
      "كلمتا المرور غير متطابقتين."
    );

    return;
  }


  const { error } =
    await supabaseClient.auth.updateUser({
      password: password
    });


  if (error) {

    console.error(error);

    showMessage(
      "passwordMessage",
      "تعذر تغيير كلمة المرور: " + error.message
    );

    return;
  }


  showMessage(
    "passwordMessage",
    "تم تغيير كلمة المرور بنجاح. يمكنك الآن تسجيل الدخول."
  );


  setTimeout(() => {

    showLogin();

  }, 2000);

}


/* =========================================================
   SESSION / RECOVERY EVENT
========================================================= */

supabaseClient.auth.onAuthStateChange(
  async (event, session) => {

    console.log("Auth event:", event);


    /*
      عندما يفتح المستخدم رابط تغيير كلمة المرور
    */

    if (event === "PASSWORD_RECOVERY") {

      document.getElementById("authScreen")
        .style.display = "flex";

      document.getElementById("dashboard")
        .style.display = "none";

      document.getElementById("loginBox")
        .classList.add("hidden");

      document.getElementById("recoveryBox")
        .classList.add("hidden");

      document.getElementById("newPasswordBox")
        .classList.remove("hidden");

      return;
    }


    if (
      event === "SIGNED_IN" &&
      session &&
      event !== "PASSWORD_RECOVERY"
    ) {

      currentUser = session.user;

    }

  }
);


/* =========================================================
   OPEN DASHBOARD
========================================================= */

async function openDashboard() {

  if (!currentUser) return;


  document.getElementById("authScreen")
    .style.display = "none";

  document.getElementById("dashboard")
    .style.display = "block";


  document.getElementById("ownerEmail")
    .textContent = currentUser.email;


  await loadStore();

}


/* =========================================================
   LOAD STORE
========================================================= */

async function loadStore() {

  const { data, error } =
    await supabaseClient
      .from("stores")
      .select("*")
      .eq("owner_id", currentUser.id)
      .maybeSingle();


  if (error) {

    console.error(error);

    alert(
      "حدث خطأ أثناء تحميل المتجر:\n" +
      error.message
    );

    return;
  }


  if (!data) {

    alert(
      "لم يتم العثور على المتجر المرتبط بهذا الحساب."
    );

    return;
  }


  currentStore = data;


  document.getElementById("storeName")
    .value = data.name || "";

  document.getElementById("storeSlug")
    .value = data.slug || "";

  document.getElementById("storeHero")
    .value = data.hero_text || "";

  document.getElementById("storeAbout")
    .value = data.about || "";

  document.getElementById("storeWhatsapp")
    .value = data.whatsapp || "";

  document.getElementById("storeInstagram")
    .value = data.instagram || "";

  document.getElementById("storeAddress")
    .value = data.address || "";

  document.getElementById("storeColor")
    .value = data.primary_color || "#d6b36a";


  await loadProducts();

}


/* =========================================================
   SAVE STORE
========================================================= */

async function saveStore() {

  if (!currentStore) return;


  const updateData = {

    name:
      document.getElementById("storeName").value.trim(),

    slug:
      document.getElementById("storeSlug").value.trim(),

    hero_text:
      document.getElementById("storeHero").value.trim(),

    about:
      document.getElementById("storeAbout").value.trim(),

    whatsapp:
      document.getElementById("storeWhatsapp").value.trim(),

    instagram:
      document.getElementById("storeInstagram").value.trim(),

    address:
      document.getElementById("storeAddress").value.trim(),

    primary_color:
      document.getElementById("storeColor").value.trim(),

    updated_at:
      new Date().toISOString()

  };


  const { error } =
    await supabaseClient
      .from("stores")
      .update(updateData)
      .eq("id", currentStore.id);


  if (error) {

    console.error(error);

    showMessage(
      "storeStatus",
      "حدث خطأ: " + error.message
    );

    return;
  }


  currentStore = {
    ...currentStore,
    ...updateData
  };


  showMessage(
    "storeStatus",
    "تم حفظ إعدادات المتجر بنجاح."
  );

}


/* =========================================================
   LOAD PRODUCTS
========================================================= */

async function loadProducts() {

  if (!currentStore) return;


  const { data, error } =
    await supabaseClient
      .from("products")
      .select("*")
      .eq("store_id", currentStore.id)
      .order("created_at", {
        ascending: false
      });


  if (error) {

    console.error(error);

    showMessage(
      "productsStatus",
      "تعذر تحميل المنتجات: " +
      error.message
    );

    return;
  }


  products = data || [];

  renderProducts();

}


/* =========================================================
   RENDER PRODUCTS
========================================================= */

function renderProducts() {

  const container =
    document.getElementById("productsList");


  if (!products.length) {

    container.innerHTML =
      `<div class="empty full">
        لا توجد منتجات حتى الآن.
      </div>`;

    return;
  }


  container.innerHTML =
    products.map(product => {

      const image =
        product.image_url ||
        "https://placehold.co/600x600/111111/d6b36a?text=LUMERA";


      return `

        <div class="product-card">

          <img
            src="${escapeHTML(image)}"
            alt="${escapeHTML(product.name)}"
          >

          <div class="product-info">

            <h3>
              ${escapeHTML(product.name)}
            </h3>

            <div class="product-price">
              ${Number(product.price).toLocaleString("fr-FR")}
            </div>

            <p style="color:#999;margin-bottom:12px;">
              المخزون: ${product.stock ?? 0}
            </p>

            <div class="product-actions">

              <button
                class="edit"
                onclick="editProduct('${product.id}')"
              >
                تعديل
              </button>

              <button
                class="delete"
                onclick="deleteProduct('${product.id}')"
              >
                حذف
              </button>

            </div>

          </div>

        </div>

      `;

    }).join("");

}


/* =========================================================
   IMAGE PREVIEW
========================================================= */

function previewImage(event) {

  const file =
    event.target.files[0];

  const preview =
    document.getElementById("imagePreview");


  if (!file) {

    preview.style.display = "none";
    return;

  }


  preview.src =
    URL.createObjectURL(file);

  preview.style.display = "block";

}


/* =========================================================
   ADD PRODUCT
========================================================= */

async function addProduct() {

  if (!currentStore || !currentUser) {

    alert("لم يتم تحميل المتجر.");
    return;

  }


  const name =
    document.getElementById("productName")
      .value
      .trim();

  const price =
    Number(
      document.getElementById("productPrice")
        .value
    );

  const category =
    document.getElementById("productCategory")
      .value;

  const stock =
    Number(
      document.getElementById("productStock")
        .value
    );

  const description =
    document.getElementById("productDescription")
      .value
      .trim();

  const imageFile =
    document.getElementById("productImage")
      .files[0];


  if (!name) {

    alert("أدخل اسم المنتج.");
    return;

  }


  if (Number.isNaN(price) || price < 0) {

    alert("أدخل سعرًا صحيحًا.");
    return;

  }


  let imageUrl = null;


  /* UPLOAD IMAGE */

  if (imageFile) {

    const extension =
      imageFile.name
        .split(".")
        .pop()
        .toLowerCase();


    const fileName =
      `${crypto.randomUUID()}.${extension}`;


    const filePath =
      `${currentUser.id}/${fileName}`;


    const { error: uploadError } =
      await supabaseClient
        .storage
        .from("product-images")
        .upload(
          filePath,
          imageFile,
          {
            cacheControl: "3600",
            upsert: false
          }
        );


    if (uploadError) {

      console.error(uploadError);

      showMessage(
        "addStatus",
        "فشل رفع الصورة: " +
        uploadError.message
      );

      return;

    }


    const { data: publicData } =
      supabaseClient
        .storage
        .from("product-images")
        .getPublicUrl(filePath);


    imageUrl =
      publicData.publicUrl;

  }


  /* INSERT PRODUCT */

  const { error } =
    await supabaseClient
      .from("products")
      .insert({

        store_id: currentStore.id,

        name: name,

        price: price,

        category: category,

        description: description,

        image_url: imageUrl,

        stock: stock,

        active: true

      });


  if (error) {

    console.error(error);

    showMessage(
      "addStatus",
      "فشل إضافة المنتج: " +
      error.message
    );

    return;

  }


  showMessage(
    "addStatus",
    "تمت إضافة المنتج بنجاح."
  );


  /* CLEAR FORM */

  document.getElementById("productName")
    .value = "";

  document.getElementById("productPrice")
    .value = "";

  document.getElementById("productStock")
    .value = "1";

  document.getElementById("productDescription")
    .value = "";

  document.getElementById("productImage")
    .value = "";

  document.getElementById("imagePreview")
    .style.display = "none";


  await loadProducts();

}


/* =========================================================
   EDIT PRODUCT
========================================================= */

async function editProduct(id) {

  const product =
    products.find(
      item => item.id === id
    );


  if (!product) return;


  const newName =
    prompt(
      "اسم المنتج:",
      product.name
    );


  if (newName === null) return;


  const newPrice =
    prompt(
      "السعر:",
      product.price
    );


  if (newPrice === null) return;


  const price =
    Number(newPrice);


  if (Number.isNaN(price) || price < 0) {

    alert("السعر غير صحيح.");
    return;

  }


  const { error } =
    await supabaseClient
      .from("products")
      .update({

        name: newName.trim(),

        price: price,

        updated_at:
          new Date().toISOString()

      })
      .eq("id", id);


  if (error) {

    alert(
      "حدث خطأ:\n" +
      error.message
    );

    return;

  }


  await loadProducts();

}


/* =========================================================
   DELETE PRODUCT
========================================================= */

async function deleteProduct(id) {

  const product =
    products.find(
      item => item.id === id
    );


  if (!product) return;


  const confirmed =
    confirm(
      `هل أنت متأكد من حذف "${product.name}"؟`
    );


  if (!confirmed) return;


  const { error } =
    await supabaseClient
      .from("products")
      .delete()
      .eq("id", id);


  if (error) {

    alert(
      "فشل الحذف:\n" +
      error.message
    );

    return;

  }


  await loadProducts();

}


/* =========================================================
   TABS
========================================================= */

function openTab(tabId, button) {

  document
    .querySelectorAll(".tab-content")
    .forEach(tab => {

      tab.classList.add("hidden");

    });


  document
    .getElementById(tabId)
    .classList.remove("hidden");


  document
    .querySelectorAll(".tab")
    .forEach(btn => {

      btn.classList.remove("active");

    });


  button.classList.add("active");

}


/* =========================================================
   INITIAL SESSION CHECK
========================================================= */

async function checkSession() {

  const { data } =
    await supabaseClient.auth.getSession();


  const session =
    data.session;


  if (session) {

    currentUser =
      session.user;


    /*
      إذا كنا في وضع تغيير كلمة المرور
      لا نفتح لوحة الإدارة
    */

    const hash =
      window.location.hash;


    if (
      hash.includes("type=recovery")
    ) {

      document.getElementById("authScreen")
        .style.display = "flex";

      document.getElementById("loginBox")
        .classList.add("hidden");

      document.getElementById("recoveryBox")
        .classList.add("hidden");

      document.getElementById("newPasswordBox")
        .classList.remove("hidden");

      return;

    }


    await openDashboard();

  }

}


/* =========================================================
   START
========================================================= */

checkSession();

</script>
